version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chat_widget
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: .
    command: bun src/apps/api.ts
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"
  ws:
    build: .
    command: bun src/apps/ws.ts
    env_file: .env
    depends_on:
      - redis
    ports:
      - "3001:3001"
  worker:
    build: .
    command: bun src/apps/worker.ts
    env_file: .env
    depends_on:
      - db
      - redis
  ai:
    build: .
    command: bun src/apps/ai.ts
    env_file: .env
    depends_on:
      - db
      - redis
volumes:
  db_data:
